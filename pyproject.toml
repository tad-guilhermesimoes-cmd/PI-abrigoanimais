[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["python", "mysql"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
# Depends()/Query()/File() como valor padrão é o jeito do FastAPI
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# templates SVG ficam mais legíveis numa linha só
"scripts/gerar_der.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
