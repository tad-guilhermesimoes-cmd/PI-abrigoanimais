<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AmparaPet — Como adotar (teste)</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<h1>Como adotar (RF12)</h1>
<div id="conteudo"></div>

<script src="comum.js"></script>
<script>
nav();
rodape().then(a => {
  document.getElementById("conteudo").innerHTML = `
    <h2>Passo a passo</h2><pre>${esc(a.como_adotar)}</pre>
    <h2>Documentos necessários</h2><pre>${esc(a.documentos_adocao)}</pre>
    <h2>Endereço e horários (RF13)</h2>
    <pre>${esc(a.endereco)} — ${esc(a.cidade)}\n${esc(a.horario_funcionamento)}</pre>
    ${a.whatsapp ? `<p><a href="https://wa.me/${a.whatsapp}" target="_blank">Falar com o abrigo no WhatsApp</a></p>` : ""}`;
});
</script>
</body>
</html>
